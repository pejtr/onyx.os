services:
  open-lovable:
    build:
      context: ../..
      dockerfile: infra/runtimes/open-lovable/Dockerfile
    environment:
      ONYX_RUNTIME_TOKEN: ${ONYX_OPEN_LOVABLE_TOKEN:?set ONYX_OPEN_LOVABLE_TOKEN}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      SANDBOX_PROVIDER: ${SANDBOX_PROVIDER:-e2b}
      E2B_API_KEY: ${E2B_API_KEY:-}
      VERCEL_TEAM_ID: ${VERCEL_TEAM_ID:-}
      VERCEL_PROJECT_ID: ${VERCEL_PROJECT_ID:-}
      VERCEL_TOKEN: ${VERCEL_TOKEN:-}
    ports:
      - "127.0.0.1:18081:8080"

  motion-anything:
    build:
      context: ../..
      dockerfile: infra/runtimes/motion-anything/Dockerfile
    environment:
      ONYX_RUNTIME_TOKEN: ${ONYX_MOTION_ANYTHING_TOKEN:?set ONYX_MOTION_ANYTHING_TOKEN}
      MOTION_BYOK_API_KEY: ${MOTION_BYOK_API_KEY:-}
      MOTION_BYOK_PROVIDER: ${MOTION_BYOK_PROVIDER:-anthropic}
      MOTION_BYOK_MODEL: ${MOTION_BYOK_MODEL:-}
    volumes:
      - onyx_motion_data:/data
    ports:
      - "127.0.0.1:18082:8080"

  html-video:
    build:
      context: ../..
      dockerfile: infra/runtimes/html-video/Dockerfile
    environment:
      ONYX_RUNTIME_TOKEN: ${ONYX_HTML_VIDEO_TOKEN:?set ONYX_HTML_VIDEO_TOKEN}
      ANTHROPIC_API_KEY: ${HTML_VIDEO_ANTHROPIC_API_KEY:-}
      ANTHROPIC_AUTH_TOKEN: ${HTML_VIDEO_ANTHROPIC_AUTH_TOKEN:-}
      ANTHROPIC_BASE_URL: ${HTML_VIDEO_ANTHROPIC_BASE_URL:-}
    volumes:
      - onyx_html_video_data:/data
    ports:
      - "127.0.0.1:18083:8080"

volumes:
  onyx_motion_data:
  onyx_html_video_data:
